<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure aur chai</title>
</head>
<body style="background-color: #313131;">
    <button id="orange">Orange button</button>
    <button id="green">Green button</button>
</body>
<script>

    //Lexical scoping:

    // function init() {
    //     let name = "Mozilla"; 
    //     function displayName() {
    
    //     console.log(name); 
    //     }

    //     displayName();
    
    // }
    // init();

    function outer(){
        let username = "hitesh"
        function inner(){
            console.log("ineer",username) //inner function can access properties of outer function
        }
        inner()
    }
    outer()
    // console.log("Too outer", username)//properties out of function can not be accessed

    // Closure

    function makeFunc() {
        const name = "Mozilla";
        function displayName() {
            console.log(name);
        }
        return displayName;
    }

    const myFunc = makeFunc();
    myFunc();

</script>
<script>
    
    // document.getElementById('orange').onclick = function(){
    //     document.body.style.backgroundColor = `orange`
    // }
    // document.getElementById('green').onclick = function(){
    //     document.body.style.backgroundColor = `green`
    // }
    
    function clickHandler(color){
        // document.body.style.backgroundColor = `${color}`

        return function(){
            document.body.style.backgroundColor = `${color}`
        }
    }
    document.getElementById('orange').onclick = clickHandler("orange")
</script>
</html>
